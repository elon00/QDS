name: PQC dependency repair verification

on:
  push:
    branches:
      - automation/fix-pqc-deps-20260922

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Capture synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native quality gate
        run: npm run qmoosa:finish
      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json
